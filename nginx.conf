# nginx-Konfiguration für die CH-Inventur-PWA (SPA + Service Worker).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Client-seitiges Routing (React Router): unbekannte Pfade auf index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Service Worker und Manifest nicht cachen (sonst hängt die App auf alter Version)
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }
  location = /registerSW.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }
  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
  }

  # Gehashte Assets (Dateiname ändert sich bei jedem Build) -> lange cachen
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;
}
