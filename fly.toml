# Fly.io-Konfiguration für CH-Inventur.
# App-Name ist global eindeutig – ggf. beim ersten `fly launch` anpassen.
app = "ch-inventur"
primary_region = "fra"  # Frankfurt – niedrigste Latenz Richtung Schweiz

[build]
  # VITE_*-Werte werden zur Build-Zeit ins Bundle gebacken (anon-Key ist öffentlich).
  [build.args]
    VITE_SUPABASE_URL = "https://erobkjxbcsqpguocwbih.supabase.co"
    VITE_SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVyb2JranhiY3NxcGd1b2N3YmloIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQzNjE0MzcsImV4cCI6MjA5OTkzNzQzN30.IHJzlL83vDqEvgn_kLopDppjetE0iSosI6pY7btAN9k"

[http_service]
  internal_port = 80
  force_https = true
  # Kleines Team-Tool: Maschine schläft bei Inaktivität ein (spart Kosten),
  # startet bei der ersten Anfrage automatisch wieder.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "5s"
    interval = "30s"
    method = "get"
    path = "/"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
